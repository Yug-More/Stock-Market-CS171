[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
description = "Research code for reliability and generalization in financial time-series forecasting."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yug More", email = "yugmore20@gmail.com" },
  { name = "Srihan Cheemangunta" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
research = [
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "torch>=2.2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
marketpulse-validate = "marketpulse.data.cli:main"
marketpulse-benchmark = "marketpulse.experiments.cli:main"
marketpulse-walkforward = "marketpulse.experiments.walkforward_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marketpulse = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
